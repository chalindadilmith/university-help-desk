<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('Edit Ticket', 'tickets', ~{::section})}">
<section>
    <a th:href="@{/student/tickets/{id}(id=${ticket.id})}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to ticket</a>
    <h1 class="mt-1"><i class="fa-solid fa-pen"></i> Edit <span th:text="${ticket.ticketRef}"></span></h1>

    <div class="alert alert-error" th:if="${error}"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${error}"></span></div>

    <div class="card">
        <form th:action="@{/student/tickets/{id}/edit(id=${ticket.id})}" th:object="${editForm}" method="post">
            <div class="form-row">
                <div>
                    <label for="categoryId">Category</label>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div>
                    <label for="priority">Priority</label>
                    <select id="priority" th:field="*{priority}">
                        <option th:each="p : ${priorities}" th:value="${p.name()}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(p.name()))}"></option>
                    </select>
                </div>
            </div>

            <label for="subject">Subject</label>
            <input type="text" id="subject" th:field="*{subject}"/>
            <span class="field-error" th:if="${#fields.hasErrors('subject')}"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{subject}"></span></span>

            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('description')}"><i class="fa-solid fa-circle-exclamation"></i> <span th:errors="*{description}"></span></span>

            <div class="actions mt-1">
                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                <a th:href="@{/student/tickets/{id}(id=${ticket.id})}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</section>
</div>
</body>
</html>

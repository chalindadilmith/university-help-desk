<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Access Denied</title>
    <link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg(v=3)}"/>
    <link rel="icon" type="image/x-icon" sizes="any" th:href="@{/images/favicon.ico(v=3)}"/>
</head>
<body>
<div class="error-page">
    <span class="error-icon"><i class="fa-solid fa-lock"></i></span>
    <h1>403</h1>
    <p>You don't have permission to view this page.</p>
    <p class="muted" th:if="${message}" th:text="${message}"></p>
    <a class="btn" th:href="@{/}"><i class="fa-solid fa-house"></i> Go back home</a>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{fragments/layout :: layout('Dashboard', 'dashboard', ~{::section})}">
<section>
    <h1><i class="fa-solid fa-gauge-high"></i> Welcome back, <span sec:authentication="name">Staff</span></h1>

    <div class="card-grid">
        <div class="card stat-card">
            <span class="stat-icon"><i class="fa-solid fa-inbox"></i></span>
            <div class="stat-body">
                <div class="stat-value" th:text="${queueSize}"></div>
                <div class="stat-label">In Your Queue</div>
            </div>
        </div>
        <div class="card stat-card">
            <span class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
            <div class="stat-body">
                <div class="stat-value" th:text="${unassignedCount}"></div>
                <div class="stat-label">Unassigned</div>
            </div>
        </div>
        <div class="card stat-card">
            <span class="stat-icon"><i class="fa-solid fa-user-check"></i></span>
            <div class="stat-body">
                <div class="stat-value" th:text="${myTicketCount}"></div>
                <div class="stat-label">Assigned to Me</div>
            </div>
        </div>
    </div>

    <div class="section-title"><h2><i class="fa-solid fa-bolt"></i> Quick Actions</h2></div>
    <div class="card-grid">
        <a class="card" th:href="@{/staff/tickets}"><span class="card-icon"><i class="fa-solid fa-ticket"></i></span> View Ticket Queue</a>
        <a class="card" th:href="@{/staff/kb}"><span class="card-icon"><i class="fa-solid fa-book-open-reader"></i></span> Manage FAQ Articles</a>
        <a class="card" th:href="@{/reports}"><span class="card-icon"><i class="fa-solid fa-chart-line"></i></span> View Reports</a>
    </div>

    <div class="section-title"><h2><i class="fa-solid fa-list-check"></i> Queue Preview</h2></div>
    <div class="empty-state" th:if="${#lists.isEmpty(recentQueue)}"><i class="fa-regular fa-circle-check"></i>Nothing in your queue right now.</div>
    <table th:unless="${#lists.isEmpty(recentQueue)}">
        <thead><tr><th>Ref</th><th>Subject</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="t : ${recentQueue}">
            <td th:text="${t.ticketRef}"></td>
            <td><a th:href="@{/staff/tickets/{id}(id=${t.id})}" th:text="${t.subject}"></a></td>
            <td><span class="badge" th:classappend="'badge-' + ${t.status.name().toLowerCase()}" th:text="${t.status}"></span></td>
        </tr>
        </tbody>
    </table>
</section>
</div>
</body>
</html>

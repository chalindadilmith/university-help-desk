spring.application.name=university-help-desk

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Microsoft SQL Server datasource ----
# Unlike MySQL, SQL Server won't create the database for you - it must already exist
# (CREATE DATABASE helpdesk_db; run once in SSMS, along with the helpdesk_user login).
# If you're connecting to a named instance (e.g. SQLEXPRESS) instead of the default
# instance, replace "localhost:1433" below with "localhost\\SQLEXPRESS" (note the
# double backslash) and the SQL Server Browser service must be running.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=helpdesk_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:helpdesk_user}
spring.datasource.password=${DB_PASSWORD:YourStrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA / Hibernate ----
# ddl-auto=update is fine for development; switch to validate (or a migration
# tool like Flyway) once the schema stabilizes and you have real demo data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Pin the dialect explicitly now that the driver identifies as SQL Server instead
# of MySQL, so there's no ambiguity in how Hibernate generates SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Most entity associations (KbArticle.category, Ticket.student/category/
# assignedStaff, LostFoundItem.reporter, etc.) are FetchType.LAZY, and many
# Thymeleaf templates dereference them directly (e.g. ${a.category.name}).
# With open-in-view=false the Hibernate session closes as soon as each
# repository call returns, so those lazy proxies fail to initialize during
# view rendering (LazyInitializationException), which Thymeleaf reports as
# "An error happened during template parsing" - e.g. templates/staff/kb.html.
# Keeping the session open through rendering (Spring Boot's own default)
# fixes this without having to add JOIN FETCH to every list/detail query.
spring.jpa.open-in-view=${OPEN_IN_VIEW:true}

# ---- Thymeleaf ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---- File upload (ticket attachments) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

# ---- Session ----
server.servlet.session.timeout=30m
# Session cookie hardening: not readable from JavaScript, not sent on cross-site requests,
# session id only in the cookie (never in the URL). Set SESSION_COOKIE_SECURE=true when the
# site is served over HTTPS so the cookie is never sent over plain HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.helpdesk=DEBUG

# ---- Demo data seeding (DEV ONLY) ----
# Creates admin@helpdesk.university / Admin@123 and staff@helpdesk.university / Staff@123
# on first startup so the team can log in and test all three roles before any
# real accounts exist. Set to false once real accounts are created, and
# certainly before final submission/demo day.
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- Chatbot AI (general conversation) ----
# Works with any OpenAI-compatible provider. Defaults are for Groq (free tier).
# Set the CHATBOT_API_KEY environment variable to let the student chatbot answer general
# questions (using knowledge-base articles as context). Leave it unset and the chatbot
# keeps working as before, answering from the knowledge base only.
# Never put the key in this file or commit it to git.
app.chatbot.ai.api-key=${CHATBOT_API_KEY:}
app.chatbot.ai.base-url=${CHATBOT_BASE_URL:https://api.groq.com/openai/v1}
app.chatbot.ai.model=${CHATBOT_MODEL:openai/gpt-oss-20b}
app.chatbot.ai.max-tokens=1200

# ---- Knowledge base search ranking (Strategy pattern) ----
# weighted (default) = phrase/words in title, then content | title-only = titles only
# | popular = weighted score plus a bonus for often-viewed articles.
app.kb.ranking=${KB_RANKING:weighted}

# Mail (forgot-password + Lost & Found verification emails).
# Gmail: enable 2-step verification, create an App Password, then set MAIL_USERNAME / MAIL_PASSWORD env vars.
# If MAIL_USERNAME is empty the app still works: emails are written to the log instead of being sent.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
# Public address used in links inside emails (set to your tunnel/host URL when sharing the app).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ---- Public contact details (shown on the home page and FAQ page) ----
# Replace these with the real university details, or override with environment variables.
app.university-name=${UNIVERSITY_NAME:University}
app.contact.hours=${CONTACT_HOURS:Mon-Fri, 8:30-16:30}
app.contact.location=${CONTACT_LOCATION:Main Building, Ground Floor}
app.contact.email=${CONTACT_EMAIL:helpdesk@university.edu}
app.contact.phone=${CONTACT_PHONE:+94 11 000 0000}
app.contact.response-time=${CONTACT_RESPONSE_TIME:Within 1 working day}

# ---- One-off clean slate (DESTRUCTIVE) ----
# Set RESET_DATABASE=true for ONE start-up to delete every row in every table and every uploaded file.
# Only the admin and staff sign-ins (plus the baseline categories / work-pool / FAQ / semester) are
# re-created afterwards. Leave it unset or false for normal use.
app.reset-database=${RESET_DATABASE:false}



spring.application.name=university-help-desk

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- MySQL datasource ----
# Create the schema first: CREATE DATABASE helpdesk_db;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update is fine for development; switch to validate (or a migration
# tool like Flyway) once the schema stabilizes and you have real demo data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Most entity associations (KbArticle.category, Ticket.student/category/
# assignedStaff, LostFoundItem.reporter, etc.) are FetchType.LAZY, and many
# Thymeleaf templates dereference them directly (e.g. ${a.category.name}).
# With open-in-view=false the Hibernate session closes as soon as each
# repository call returns, so those lazy proxies fail to initialize during
# view rendering (LazyInitializationException), which Thymeleaf reports as
# "An error happened during template parsing" - e.g. templates/staff/kb.html.
# Keeping the session open through rendering (Spring Boot's own default)
# fixes this without having to add JOIN FETCH to every list/detail query.
spring.jpa.open-in-view=${OPEN_IN_VIEW:true}

# ---- Thymeleaf ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---- File upload (ticket attachments) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Session ----
server.servlet.session.timeout=30m

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.helpdesk=DEBUG

# ---- Demo data seeding (DEV ONLY) ----
# Creates admin@helpdesk.university / Admin@123 and staff@helpdesk.university / Staff@123
# on first startup so the team can log in and test all three roles before any
# real accounts exist. Set to false once real accounts are created, and
# certainly before final submission/demo day.
app.seed-demo-data=${SEED_DEMO_DATA:true}

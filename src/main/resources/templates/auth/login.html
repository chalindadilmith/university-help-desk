<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - University Help Desk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>University Help Desk</h1>

        <div class="alert alert-error" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
        <div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in.</div>

        <form th:action="@{/login}" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required="required" autofocus="autofocus"/>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required="required"/>

            <button type="submit" class="btn" style="width:100%;">Login</button>
        </form>
        <p class="mt-1">Don't have an account? <a th:href="@{/register}">Register here</a></p>
    </div>
</div>
</body>
</html>

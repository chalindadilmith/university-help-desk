<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register - University Help Desk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="max-width:440px;">
        <h1>Student Registration</h1>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}"/>
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

            <label for="universityId">University ID</label>
            <input type="text" id="universityId" th:field="*{universityId}"/>
            <span class="field-error" th:if="${#fields.hasErrors('universityId')}" th:errors="*{universityId}"></span>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"/>
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>

            <button type="submit" class="btn" style="width:100%;">Register</button>
        </form>
        <p class="mt-1">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</div>
</body>
</html>

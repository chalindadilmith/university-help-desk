<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('My Profile', 'profile', ~{::section})}">
<section>
    <h1>My Profile</h1>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="card" style="max-width:480px;">
        <form th:action="@{/profile}" method="post">
            <label>University / Staff ID</label>
            <input type="text" th:value="${user.universityId}" disabled="disabled"/>

            <label>Email</label>
            <input type="text" th:value="${user.email}" disabled="disabled"/>

            <label>Role</label>
            <input type="text" th:value="${user.role}" disabled="disabled"/>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" th:value="${user.fullName}"/>

            <button type="submit" class="btn">Save Changes</button>
        </form>
    </div>
</section>
</div>
</body>
</html>

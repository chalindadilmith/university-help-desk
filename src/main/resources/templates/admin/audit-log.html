<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('Audit Log', 'audit-log', ~{::section})}">
<section>
    <h1>Audit Log</h1>
    <p class="muted">Every administrative action, most recent first (UC-02).</p>

    <table>
        <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
            <td th:text="${log.actor.fullName}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.targetEntity} + (${log.targetId} != null ? ' #' + ${log.targetId} : '')"></td>
            <td th:text="${log.details}"></td>
        </tr>
        </tbody>
    </table>
</section>
</div>
</body>
</html>

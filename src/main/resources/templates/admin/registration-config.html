<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('Registration Setup', 'registration-config', ~{::section})}">
<section>
    <h1><i class="fa-solid fa-calendar-plus"></i> Semester Registration Setup</h1>
    <div class="alert alert-success" th:if="${success}"><i class="fa-solid fa-circle-check"></i><span th:text="${success}"></span></div>
    <div class="alert alert-error" th:if="${error}"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${error}"></span></div>
    <p class="muted">Modules and the modules offered in each semester are managed on the <a th:href="@{/admin/modules}">Module Offerings</a> page. Submitted registrations are reviewed under <a th:href="@{/admin/registrations}">Registration Approvals</a>.</p>

    <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="card">
            <h2><i class="fa-regular fa-calendar"></i> Semesters</h2>
            <form th:action="@{/admin/registration-config/semesters}" th:object="${semesterForm}" method="post">
                <label for="semName">Name</label>
                <input type="text" id="semName" th:field="*{name}" placeholder="e.g. 2026 Semester 2"/>
                <div class="form-row">
                    <div><label for="startDate">Start</label><input type="date" id="startDate" th:field="*{startDate}"/></div>
                    <div><label for="endDate">End</label><input type="date" id="endDate" th:field="*{endDate}"/></div>
                </div>
                <label style="font-weight:normal;"><input type="checkbox" th:field="*{registrationOpen}" style="width:auto; display:inline-block;"/> Registration open</label>
                <button type="submit" class="btn btn-sm mt-1"><i class="fa-solid fa-plus"></i> Add Semester</button>
            </form>
            <table class="mt-1">
                <thead><tr><th>Name</th><th>Dates</th><th>Registration</th><th></th></tr></thead>
                <tbody>
                <tr th:each="s : ${semesters}">
                    <td th:text="${s.name}"></td>
                    <td class="muted" th:text="${#temporals.format(s.startDate, 'dd MMM yy')} + ' - ' + ${#temporals.format(s.endDate, 'dd MMM yy')}"></td>
                    <td><span class="badge" th:classappend="${s.registrationOpen} ? 'badge-open' : 'badge-closed'" th:text="${s.registrationOpen} ? 'Open' : 'Closed'"></span></td>
                    <td>
                        <form th:action="@{/admin/registration-config/semesters/{id}/toggle(id=${s.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline" th:text="${s.registrationOpen} ? 'Close' : 'Open'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-graduation-cap"></i> Degree Specialisations</h2>
            <form th:action="@{/admin/registration-config/specialisations}" th:object="${specialisationForm}" method="post">
                <div class="form-row">
                    <div><label for="specCode">Code</label><input type="text" id="specCode" th:field="*{code}" placeholder="e.g. SE"/></div>
                    <div><label for="specName">Name</label><input type="text" id="specName" th:field="*{name}" placeholder="e.g. Software Engineering"/></div>
                </div>
                <label for="specDesc">Description (optional)</label>
                <input type="text" id="specDesc" th:field="*{description}"/>
                <button type="submit" class="btn btn-sm"><i class="fa-solid fa-plus"></i> Add Specialisation</button>
            </form>
            <table class="mt-1">
                <thead><tr><th>Code</th><th>Name</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="sp : ${specialisations}">
                    <td th:text="${sp.code}"></td>
                    <td th:text="${sp.name}"></td>
                    <td><span class="badge" th:classappend="${sp.active} ? 'badge-active' : 'badge-closed'" th:text="${sp.active} ? 'Active' : 'Hidden'"></span></td>
                    <td>
                        <form th:action="@{/admin/registration-config/specialisations/{id}/toggle(id=${sp.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline" th:text="${sp.active} ? 'Hide' : 'Show'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</div>
</body>
</html>

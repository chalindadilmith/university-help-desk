<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('Manage FAQ', 'kb', ~{::section})}">
<section>
    <h1>Manage Knowledge Base Articles</h1>

    <div class="alert alert-success" th:if="${success}"><i class="fa-solid fa-circle-check"></i><span th:text="${success}"></span></div>
    <div class="alert alert-error" th:if="${error}"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${error}"></span></div>

    <div class="card">
        <h2 th:text="${articleForm.id != null} ? 'Edit Article' : 'New Article'"></h2>
        <form th:action="@{/staff/kb}" th:object="${articleForm}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" maxlength="200"/>
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

            <label for="categoryId">Category</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>

            <label for="content">Content</label>
            <textarea id="content" th:field="*{content}" maxlength="10000" style="min-height:160px;"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>

            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="PUBLISHED">Published (visible to students)</option>
                <option value="DRAFT">Draft (hidden from students)</option>
            </select>

            <button type="submit" class="btn">Save Article</button>
            <a th:if="${articleForm.id != null}" th:href="@{/staff/kb}" class="btn btn-outline">Cancel edit</a>
        </form>
    </div>

    <div class="card">
        <h3>Add a Category</h3>
        <form th:action="@{/staff/kb/categories}" method="post" class="form-row" style="align-items:flex-end;">
            <div><label for="catName">Name</label><input type="text" id="catName" name="name" maxlength="100" required/></div>
            <div><button type="submit" class="btn btn-sm btn-secondary">Add</button></div>
        </form>

        <div th:unless="${#lists.isEmpty(categories)}" style="margin-top:1rem;">
            <h3>Existing Categories</h3>
            <p class="muted">Rename a category, or remove it when no article uses it.</p>
            <table>
                <thead><tr><th>Name</th><th></th></tr></thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td>
                        <form th:action="@{/staff/kb/categories/{id}/rename(id=${c.id})}" method="post" style="display:flex;gap:.5rem;align-items:center;">
                            <input type="text" name="name" th:value="${c.name}" maxlength="100" required th:attr="aria-label='Name of category ' + ${c.name}"/>
                            <button type="submit" class="btn btn-sm btn-outline">Rename</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/staff/kb/categories/{id}/delete(id=${c.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirmAction('Remove this category?')">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="section-title"><h2>All Articles</h2></div>
    <form th:action="@{/staff/kb}" method="get" class="form-row" style="align-items:flex-end;">
        <div><input type="text" name="q" th:value="${q}" placeholder="Filter by title or category"/></div>
        <div><button type="submit" class="btn btn-sm btn-outline">Filter</button>
            <a th:if="${q != null and !q.isBlank()}" th:href="@{/staff/kb}" class="btn btn-sm btn-outline">Clear</a></div>
    </form>
    <div class="empty-state" th:if="${#lists.isEmpty(articles)}">No articles found.</div>
    <table th:unless="${#lists.isEmpty(articles)}">
        <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Views</th><th>Helpful</th><th>Author</th><th>Last edited</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${articles}">
            <td th:text="${a.title}"></td>
            <td th:text="${a.category.name}"></td>
            <td><span class="badge" th:classappend="'badge-' + ${a.status.name().toLowerCase()}" th:text="${a.status}"></span></td>
            <td th:text="${a.viewCount}"></td>
            <td th:text="${a.helpfulCount} + ' yes / ' + ${a.notHelpfulCount} + ' no'"></td>
            <td th:text="${a.author.fullName}"></td>
            <td th:text="${#temporals.format(a.updatedAt != null ? a.updatedAt : a.createdAt, 'dd MMM yyyy')}"></td>
            <td>
                <a th:href="@{/staff/kb(editId=${a.id})}" class="btn btn-sm btn-outline">Edit</a>
                <form th:action="@{/staff/kb/{id}/delete(id=${a.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirmAction('Remove this article?')">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</div>
</body>
</html>

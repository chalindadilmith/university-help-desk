<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: layout('Item Detail', 'lost-found', ~{::section})}">
<section>
    <a th:href="@{/student/lost-found}">&larr; Back to Lost &amp; Found</a>
    <h1 class="mt-1" th:text="${item.description}"></h1>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <p><span class="badge" th:classappend="'badge-' + ${item.status.name().toLowerCase()}" th:text="${item.itemType}"></span>
           <span class="badge" th:classappend="'badge-' + ${item.status.name().toLowerCase()}" th:text="${item.status}"></span></p>
        <p><strong>Location:</strong> <span th:text="${item.location}"></span></p>
        <p><strong>Date:</strong> <span th:text="${#temporals.format(item.itemDate, 'dd MMM yyyy')}"></span></p>
        <p><strong>Reported by:</strong> <span th:text="${item.reporter.fullName}"></span></p>

        <form th:if="${item.status.name() == 'ACTIVE'}" th:action="@{/student/lost-found/{id}/claim(id=${item.id})}" method="post" class="mt-1">
            <button type="submit" class="btn" onclick="return confirmAction('Submit a claim on this item?')">This is mine / I found this</button>
        </form>
    </div>
</section>
</div>
</body>
</html>

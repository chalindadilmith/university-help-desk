<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="error-page">
    <span class="error-icon"><i class="fa-solid fa-compass"></i></span>
    <h1>404</h1>
    <p>The page or record you're looking for doesn't exist.</p>
    <p class="muted" th:if="${message}" th:text="${message}"></p>
    <a class="btn" th:href="@{/}"><i class="fa-solid fa-house"></i> Go home</a>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
